<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Eje Político</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-md border border-gray-200">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
      <h1 class="text-2xl font-bold text-gray-900 font-serif">Gestor de Contenidos - Eje Político</h1>
      <a href="index.html" target="_blank" class="text-xs font-semibold uppercase text-red-700 hover:underline">Ver Portada &rarr;</a>
    </div>

    <form id="article-form" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">ID de la Nota</label>
          <input type="text" id="nota-id" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" value="1" required>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Volanta</label>
          <input type="text" id="volanta" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" placeholder="Ej: ANÁLISIS ESTRATÉGICO" required>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Categoría</label>
          <select id="categoria" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black">
            <option>Internacional</option>
            <option>Argentina</option>
            <option>Opinión</option>
            <option>Sociedad</option>
            <option>Economía</option>
            <option selected>Latinoamérica</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Título Principal</label>
        <input type="text" id="titulo" class="w-full p-2 border border-gray-300 text-sm font-bold focus:outline-none focus:border-black" placeholder="Título de la nota..." required>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Bajada (Exactamente 3 oraciones)</label>
        <textarea id="bajada" rows="3" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" placeholder="Primera oración. Segunda oración. Tercera oración." required></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">URL de la Imagen Rectangular</label>
          <input type="url" id="imagen" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" placeholder="https://images.unsplash.com/..." required>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Epígrafe / Pie de Foto</label>
          <input type="text" id="epigrafe" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" placeholder="Pie de foto..." required>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Autor (MAYÚSCULAS)</label>
          <input type="text" id="autor" class="w-full p-2 border border-gray-300 text-sm uppercase focus:outline-none focus:border-black" placeholder="CINDY MORALES CASTILLO" required>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Lugar</label>
          <input type="text" id="lugar" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" placeholder="BOGOTÁ" required>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Fecha</label>
          <input type="text" id="fecha" class="w-full p-2 border border-gray-300 text-sm focus:outline-none focus:border-black" value="20 de Agosto de 2026" required>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Cuerpo Completo del Artículo (Usá &lt;br&gt;&lt;br&gt; para separar párrafos)</label>
        <textarea id="contenido" rows="8" class="w-full p-2 border border-gray-300 text-sm font-serif focus:outline-none focus:border-black" placeholder="Primer párrafo...<br><br>Segundo párrafo..." required></textarea>
      </div>

      <button type="submit" class="w-full bg-black text-white font-bold uppercase text-xs py-3 tracking-wider hover:bg-gray-800 transition-colors">
        Generar Código JSON Seguro
      </button>
    </form>

    <div id="output-container" class="mt-8 hidden border-t pt-6">
      <h2 class="text-sm font-bold uppercase text-red-700 mb-2">¡Código Listo para Guardar!</h2>
      <p class="text-xs text-gray-600 mb-3">Copiá este bloque completo, andá a tu archivo <code class="bg-gray-200 px-1 font-bold">data.json</code> en GitHub, borrá todo lo viejo y pegalo:</p>
      
      <textarea id="json-output" rows="12" readonly class="w-full p-3 bg-gray-900 text-green-400 font-mono text-xs border border-gray-700 rounded focus:outline-none"></textarea>
      
      <button onclick="copiarJSON()" class="mt-3 bg-red-700 text-white font-bold uppercase text-xs px-4 py-2 hover:bg-red-800 transition-colors">
        Copiar Código al Portapapeles
      </button>
    </div>
  </div>

  <script>
    document.getElementById('article-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const noteId = document.getElementById('nota-id').value;
      const volanta = document.getElementById('volanta').value;
      const titulo = document.getElementById('titulo').value;
      const bajada = document.getElementById('bajada').value;
      const imagen = document.getElementById('imagen').value;
      const epigrafe = document.getElementById('epigrafe').value;
      const autor = document.getElementById('autor').value.toUpperCase();
      const lugar = document.getElementById('lugar').value;
      const fecha = document.getElementById('fecha').value;
      const categoria = document.getElementById('categoria').value;
      const contenido = document.getElementById('contenido').value;

      const fullData = {
        siteName: "Eje Político",
        categories: [
          "Internacional", "Argentina", "Opinión", "Sociedad", "Economía", "América Futura", "Ciencia", "Salud", "Tecnología", "Cultura", "Deportes", "Estilo"
        ],
        homeData: {
          col1: {
            nota1: {
              titulo: "La guerra contra Irán abre una herida económica en EE UU con más inflación y menos crecimiento",
              autor: "JESÚS SÉRVULO GONZÁLEZ",
              lugar: "Washington",
              bajada: "Washington se enfrenta a renovadas tensiones y volatilidad en los mercados financieros.",
              vineta: "Trump proclama la mayor guerra económica contra Irán"
            },
            nota2: {
              titulo: "La deuda de EE UU supera la barrera de los 40 billones de dólares",
              autor: "J. S. GONZÁLEZ",
              lugar: "Washington",
              vineta: "El plan para contener la tormenta choca con el escepticismo del mercado"
            }
          },
          col2: {
            id: noteId,
            titulo: titulo,
            autor: autor,
            lugar: lugar,
            bajada: bajada,
            imagen: imagen,
            epigrafe: epigrafe,
            creditosFoto: "",
            vineta: "Nota principal del día"
          },
          col3: {
            nota1: {
              titulo: "La agonía cotidiana de vivir a oscuras en Venezuela",
              autor: "FLORANTONIA SINGER",
              lugar: "Caracas",
              bajada: "Los racionamientos de energía apagan los comercios.",
              imagen: "https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=800&q=80",
              epigrafe: "Protestas en Venezuela."
            },
            nota2: {
              titulo: "La Guaira se abraza al regreso del turismo",
              autor: "MARCY ALEJANDRA RANGEL",
              lugar: "Caracas"
            }
          }
        },
        articles: [
          {
            id: noteId,
            volanta: volanta,
            titulo: titulo,
            bajada: bajada,
            imagen: imagen,
            epigrafe: epigrafe,
            autor: autor,
            lugar: lugar,
            fecha: fecha,
            categoria: categoria,
            contenido: contenido,
            relacionadas: [
              { titulo: "Avanzan las cumbres bilaterales en el Sudeste Asiático", categoria: "Asia" },
              { titulo: "Giro clave en las proyecciones económicas de América Latina", categoria: "Latinoamérica" }
            ],
            comentarios: [
              { usuario: "Carlos G.", fecha: "Hace 2 horas", texto: "Excelente cobertura del escenario actual." }
            ]
          }
        ]
      };

      document.getElementById('json-output').value = JSON.stringify(fullData, null, 2);
      document.getElementById('output-container').classList.remove('hidden');
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    function copiarJSON() {
      const copyText = document.getElementById("json-output");
      copyText.select();
      document.execCommand("copy");
      alert("¡Código JSON copiado con éxito! Ahora pégalo reemplazando todo el contenido de tu archivo data.json en GitHub.");
    }
  </script>
</body>
</html>
